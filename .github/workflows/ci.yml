name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: changeguard
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: changeguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changeguard -d changeguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_USER: changeguard
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: changeguard
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      SECRET_KEY: ci-test-secret-key
      LOG_LEVEL: INFO
      MAX_UPLOAD_MB: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -v
